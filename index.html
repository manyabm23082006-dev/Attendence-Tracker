/* ============================== DATE HELPERS ============================== */
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY_NAMES_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function pad2(n){ return n < 10 ? "0"+n : ""+n; }
function toISO(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function fromISO(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function todayISO(){ return toISO(new Date()); }
function addDays(iso, n){ const d = fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function dayOfWeekName(iso){ return DAY_NAMES_LONG[fromISO(iso).getDay()]; }
function fmtLong(iso){ const d = fromISO(iso); return MONTH_NAMES[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
function fmtShort(iso){ const d = fromISO(iso); return MONTH_NAMES[d.getMonth()].slice(0,3) + " " + d.getDate(); }
function greetingWord(){ const h = new Date().getHours(); if (h < 12) return "Good Morning"; if (h < 17) return "Good Afternoon"; return "Good Evening"; }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* ============================== CALCULATION ENGINE ============================== */
function computeStats(records) {
  let present = 0, absent = 0, noClass = 0;
  for (const r of records) {
    if (r.status === "present") present++;
    else if (r.status === "absent") absent++;
    else noClass++;
  }
  const total = present + absent;
  const percentage = total > 0 ? Math.round((present / total) * 1000) / 10 : 0;
  return { present, absent, noClass, total, percentage };
}
function getStatus(stats, target) {
  if (stats.total === 0) return "nodata";
  if (stats.percentage >= target) return "safe";
  if (stats.percentage >= Math.max(target - 12, 0)) return "risky";
  return "critical";
}
const STATUS_COLOR = { safe: "mint", risky: "amber", critical: "coral", nodata: "slate" };
const STATUS_HEX = { safe: "#5FE3A1", risky: "#F3B65E", critical: "#F1706B", nodata: "#4B5563" };
const STATUS_LABEL = { safe: "On Target", risky: "Risky", critical: "Critical", nodata: "No Data" };

function safeToMiss(present, total, target) {
  if (total === 0 || target <= 0) return 0;
  const t = target / 100;
  let n = Math.floor(present / t - total);
  if (n < 0) n = 0;
  while (present / (total + n + 1) >= t) n++;
  while (n > 0 && present / (total + n) < t) n--;
  return n;
}
function neededToAttend(present, total, target) {
  const t = target / 100;
  if (t >= 1) return total === present ? 0 : Infinity;
  if (total > 0 && present / total >= t) return 0;
  let n = Math.ceil((t * total - present) / (1 - t));
  if (n < 0) n = 0;
  while (total + n > 0 && (present + n) / (total + n) < t) n++;
  return n;
}
function insightMessage(stats, target) {
  if (stats.total === 0) return "No classes recorded yet. Mark today's attendance to get started.";
  if (stats.percentage >= target) {
    const n = safeToMiss(stats.present, stats.total, target);
    return `Your attendance is ${stats.percentage}%. You're comfortably above your ${target}% target` + (n > 0 ? `, and can miss ${n} upcoming class${n===1?"":"es"} and stay safe.` : `, but you're right at the edge — one more absence could put you at risk.`);
  }
  const n = neededToAttend(stats.present, stats.total, target);
  return `Your attendance is ${stats.percentage}%, below your ${target}% target. Attend the next ${n} class${n===1?"":"es"} in a row to recover.`;
}

const LS_KEY = "attendly_state_v1";
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function persist(state) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ============================== DEMO DATA ============================== */
const PALETTE = ["#5FE3A1","#7BA8F5","#F3B65E","#F1706B","#C792F0","#5ED1E0","#F09E5E","#8FE35F"];
function generateDemoData() {
  const defs = [
    { name: "Physics", code: "PHY201", faculty: "Dr. Rao", target: 75, perWeek: 4, bias: 0.86 },
    { name: "Chemistry", code: "CHM204", faculty: "Dr. Iyer", target: 75, perWeek: 3, bias: 0.63 },
    { name: "Mathematics", code: "MTH210", faculty: "Prof. Nair", target: 75, perWeek: 5, bias: 0.79 },
    { name: "English", code: "ENG110", faculty: "Ms. Fernandes", target: 70, perWeek: 2, bias: 0.9 },
    { name: "Data Structures", code: "CSE221", faculty: "Dr. Verma", target: 80, perWeek: 4, bias: 0.71 },
    { name: "Database Mgmt Systems", code: "CSE231", faculty: "Prof. Shah", target: 75, perWeek: 3, bias: 0.58 },
  ];
  const subjects = defs.map((d, i) => ({
    id: uid(), name: d.name, code: d.code, faculty: d.faculty,
    targetPercentage: d.target, classesPerWeek: d.perWeek, color: PALETTE[i % PALETTE.length],
    createdAt: new Date().toISOString(),
  }));
  const records = [];
  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate() - 75);
  const weekDayMap = { Monday: [], Tuesday: [], Wednesday: [], Thursday: [], Friday: [] };
  const dayKeys = Object.keys(weekDayMap);
  subjects.forEach((s, si) => {
    const def = defs[si];
    for (let i = 0; i < def.perWeek; i++) {
      dayKeys[(si + i) % 5] && weekDayMap[dayKeys[(si + i) % 5]].push(s.id);
    }
  });
  const timetable = [];
  const slots = ["08:00-09:00","09:00-10:00","10:15-11:15","11:15-12:15","13:15-14:15","14:15-15:15"];
  const rooms = ["Room 101","Room 204","Lab 3","Room 310","Room 118","Lab 1"];
  dayKeys.forEach((day) => {
    let slotIdx = 0;
    weekDayMap[day].forEach((subjId) => {
      const [st, et] = slots[slotIdx % slots.length].split("-");
      timetable.push({ id: uid(), subjectId: subjId, day, startTime: st, endTime: et, room: rooms[slotIdx % rooms.length] });
      slotIdx++;
    });
  });
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const dayName = DAY_NAMES_LONG[d.getDay()];
    const iso = toISO(d);
    if (!weekDayMap[dayName]) continue;
    weekDayMap[dayName].forEach((subjId) => {
      const def = defs[subjects.findIndex(s => s.id === subjId)];
      const roll = Math.random();
      const status = roll < 0.03 ? "no-class" : (roll < def.bias + 0.03 ? "present" : "absent");
      records.push({ id: uid(), subjectId: subjId, date: iso, status, notes: "" });
    });
  }
  return { subjects, records, timetable };
}

/* ============================== CONTEXT / REDUCER ============================== */
const Store = createContext(null);
function useStore(){ return useContext(Store); }

function reducer(state, action) {
  switch (action.type) {
    case "ADD_SUBJECT": return { ...state, subjects: [...state.subjects, action.payload] };
    case "UPDATE_SUBJECT": return { ...state, subjects: state.subjects.map(s => s.id === action.payload.id ? { ...s, ...action.payload } : s) };
    case "DELETE_SUBJECT": return {
      ...state,
      subjects: state.subjects.filter(s => s.id !== action.payload),
      records: state.records.filter(r => r.subjectId !== action.payload),
      timetable: state.timetable.filter(t => t.subjectId !== action.payload),
    };
    case "MARK_ATTENDANCE": {
      const { subjectId, date, status, notes } = action.payload;
      const idx = state.records.findIndex(r => r.subjectId === subjectId && r.date === date);
      if (idx >= 0) {
        const copy = state.records.slice();
        copy[idx] = { ...copy[idx], status, notes: notes ?? copy[idx].notes };
        return { ...state, records: copy };
      }
      return { ...state, records: [...state.records, { id: uid(), subjectId, date, status, notes: notes || "" }] };
    }
    case "DELETE_RECORD": return { ...state, records: state.records.filter(r => r.id !== action.payload) };
    case "ADD_TIMETABLE": return { ...state, timetable: [...state.timetable, action.payload] };
    case "UPDATE_TIMETABLE": return { ...state, timetable: state.timetable.map(t => t.id === action.payload.id ? { ...t, ...action.payload } : t) };
    case "DELETE_TIMETABLE": return { ...state, timetable: state.timetable.filter(t => t.id !== action.payload) };
    case "UPDATE_SETTINGS": return { ...state, settings: { ...state.settings, ...action.payload } };
    case "LOAD_DEMO": { const demo = generateDemoData(); return { ...state, ...demo, hasDemo: true }; }
    case "CLEAR_DEMO": return { ...emptyState(), settings: state.settings, hasDemo: false };
    case "RESET_ALL": return emptyState();
    case "IMPORT": return { ...emptyState(), ...action.payload };
    default: return state;
  }
}

/* ============================== SMALL UI PRIMITIVES ============================== */
function ProgressBar({ value, colorVar = "mint", track = "surface2" }) {
  const pct = Math.max(0, Math.min(100, value));
  return (
    <div className={`h-2 w-full rounded-full bg-${track} overflow-hidden`}>
      <div className={`h-full rounded-full bg-${colorVar} transition-all duration-500`} style={{ width: pct + "%" }} />
    </div>
  );
}
function ProgressRing({ value, size = 156, stroke = 12, color = "#5FE3A1", trackColor = "#1C212B", children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c - (Math.max(0, Math.min(100, value)) / 100) * c;
  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} stroke={trackColor} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={offset}
          className="ring-anim" style={{ ["--ring-full"]: c, ["--ring-offset"]: offset }} />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center">{children}</div>
    </div>
  );
}
function StatusPill({ status, size = "sm" }) {
  const color = STATUS_COLOR[status];
  const label = STATUS_LABEL[status];
  const icon = status === "safe" ? "check-circle" : status === "risky" ? "alert" : status === "critical" ? "x-circle" : "minus-circle";
  const pad = size === "sm" ? "px-2 py-0.5 text-xs" : "px-3 py-1 text-sm";
  return (
    <span className={`inline-flex items-center gap-1 rounded-full bg-${color}/10 text-${color} ${pad} font-medium`}>
      <Icon name={icon} size={size === "sm" ? 13 : 15} /> {label}
    </span>
  );
}
function EmptyState({ icon = "book", title, subtitle, action }) {
  return (
    <div className="flex flex-col items-center justify-center text-center py-16 px-6 rise">
      <div className="w-16 h-16 rounded-2xl bg-surface2 flex items-center justify-center mb-4 text-dim">
        <Icon name={icon} size={30} />
      </div>
      <div className="font-display font-semibold text-lg mb-1">{title}</div>
      <div className="text-dim text-sm max-w-xs mb-5">{subtitle}</div>
      {action}
    </div>
  );
}
function Button({ children, variant = "primary", className = "", ...props }) {
  const base = "inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2.5 text-sm font-medium transition active:scale-[0.97] disabled:opacity-40 disabled:pointer-events-none";
  const variants = {
    primary: "bg-mint text-[#06140D] hover:brightness-95",
    secondary: "bg-surface2 text-ink border border-brdr hover:bg-surface2/70",
    danger: "bg-coral/15 text-coral hover:bg-coral/25",
    ghost: "text-dim hover:text-ink hover:bg-surface2",
  };
  return <button className={`${base} ${variants[variant]} ${className}`} {...props}>{children}</button>;
}
function Field({ label, children, required }) {
  return (
    <label className="block mb-4">
      <span className="block text-sm text-dim mb-1.5">{label}{required && <span className="text-coral"> *</span>}</span>
      {children}
    </label>
  );
}
const inputCls = "w-full rounded-xl bg-surface2 border border-brdr px-3.5 py-2.5 text-sm text-ink placeholder:text-faint focus:border-mint";

function Modal({ open, onClose, title, children, wide }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div
        className={`pop bg-surface w-full ${wide ? "sm:max-w-lg" : "sm:max-w-md"} sm:rounded-2xl rounded-t-2xl max-h-[88vh] overflow-y-auto border border-brdr`}
        onClick={e => e.stopPropagation()}
      >
        <div className="flex items-center justify-between px-5 py-4 border-b border-brdr sticky top-0 bg-surface z-10">
          <h3 className="font-display font-semibold text-base">{title}</h3>
          <button onClick={onClose} className="text-dim hover:text-ink p-1"><Icon name="x" size={20} /></button>
        </div>
        <div className="p-5">{children}</div>
      </div>
    </div>
  );

function useSubjectStats(subjectId, records, target) {
  return useMemo(() => {
    const recs = records.filter(r => r.subjectId === subjectId);
    const stats = computeStats(recs);
    const status = getStatus(stats, target);
    return { stats, status, recs };
  }, [subjectId, records, target]);
}

function SubjectCard({ subject, records, onClick }) {
  const { stats, status } = useSubjectStats(subject.id, records, subject.targetPercentage);
  const color = STATUS_COLOR[status];
  const helper = status === "nodata" ? "No classes recorded yet"
    : status === "safe" ? `You can miss ${safeToMiss(stats.present, stats.total, subject.targetPercentage)} class${safeToMiss(stats.present, stats.total, subject.targetPercentage)===1?"":"es"}`
    : `Need ${neededToAttend(stats.present, stats.total, subject.targetPercentage)} more class${neededToAttend(stats.present, stats.total, subject.targetPercentage)===1?"":"es"}`;
  return (
    <button onClick={onClick} className="rise text-left bg-surface border border-brdr rounded-2xl p-4 hover:border-faint transition w-full">
      <div className="flex items-start justify-between mb-3">
        <div className="flex items-center gap-2.5">
          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: subject.color }} />
          <div>
            <div className="font-semibold text-sm leading-tight">{subject.name}</div>
            {subject.code && <div className="text-xs text-faint">{subject.code}</div>}
          </div>
        </div>
        <div className="text-right">
          <div className={`num text-xl font-semibold text-${color}`}>{stats.percentage}%</div>
        </div>
      </div>
      <ProgressBar value={stats.percentage} colorVar={color} />
      <div className="flex items-center justify-between mt-2.5 text-xs text-dim">
        <span>{stats.present}P · {stats.absent}A · {stats.total} total</span>
        <StatusPill status={status} />

      <div className="text-xs text-faint mt-2">{helper}</div>

  );
}

    if (open) {
      setForm(editing ? { ...blank, ...editing } : blank);
      setCustomTarget(editing ? !TARGET_PRESETS.includes(editing.targetPercentage) : false);
    }
  }, [open, editing]);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

function MarkAttendanceModal({ open, onClose, subject, date }) {
  const { state, dispatch } = useStore();
  const existing = state.records.find(r => r.subjectId === subject?.id && r.date === date);
  const [status, setStatus] = useState("present");

  const save = () => { dispatch({ type: "MARK_ATTENDANCE", payload: { subjectId: subject.id, date, status, notes } }); onClose(); };

  const options = [
    { key: "present", label: "Present", color: "mint", icon: "check-circle" },
    { key: "absent", label: "Absent", color: "coral", icon: "x-circle" },

      <div className="flex flex-col gap-2 mb-4">

function AttendanceCalendar({ subject, records, onDayClick }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const recMap = useMemo(() => { const m = {}; records.forEach(r => { if (r.subjectId === subject.id) m[r.date] = r; }); return m; }, [records, subject.id]);
  const first = new Date(cursor.y, cursor.m, 1);
  const startOffset = first.getDay();
  const total = daysInMonth(cursor.y, cursor.m);
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= total; d++) cells.push(d);
  const move = (delta) => setCursor(c => { let m = c.m + delta, y = c.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } return { y, m }; });
  const colorFor = (status) => status === "present" ? "mint" : status === "absent" ? "coral" : status === "no-class" ? "slate" : null;
  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <button onClick={() => move(-1)} className="p-1.5 text-dim hover:text-ink"><Icon name="chev-left" size={18}/></button>
        <div className="font-display font-semibold text-sm">{MONTH_NAMES[cursor.m]} {cursor.y}</div>
        <button onClick={() => move(1)} className="p-1.5 text-dim hover:text-ink"><Icon name="chev-right" size={18}/></button>
      </div>
      <div className="grid grid-cols-7 gap-1.5 mb-1.5">
        {DAY_SHORT.map(d => <div key={d} className="text-center text-[11px] text-faint">{d}</div>)}
      </div>
      <div className="grid grid-cols-7 gap-1.5">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = `${cursor.y}-${pad2(cursor.m+1)}-${pad2(d)}`;
          const rec = recMap[iso];
          const color = colorFor(rec?.status);
          const isFuture = iso > todayISO();
          return (
            <button key={i} disabled={isFuture} onClick={() => onDayClick(iso)}
              className={`aspect-square rounded-lg text-xs flex items-center justify-center border transition
                ${color ? `bg-${color}/15 border-${color}/40 text-${color}` : "border-brdr text-dim hover:border-faint"}
                ${isFuture ? "opacity-30 cursor-not-allowed" : ""} ${iso === todayISO() ? "ring-1 ring-mint" : ""}`}>
              {d}
            </button>
          );
        })}
      </div>
      <div className="flex flex-wrap gap-3 mt-4 text-xs text-dim">
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-mint inline-block"/>Present</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-coral inline-block"/>Absent</span>
        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-slate inline-block"/>No Class</span>
      </div>
    </div>
  );
}

function TimetableModal({ open, onClose, editing }) {
  const { state, dispatch } = useStore();
  const blank = { subjectId: state.subjects[0]?.id || "", day: "Monday", startTime: "09:00", endTime: "10:00", room: "" };
  const [form, setForm] = useState(blank);
  useEffect(() => { if (open) setForm(editing ? { ...blank, ...editing } : blank); }, [open, editing]);
  const set = (k,v) => setForm(f => ({ ...f, [k]: v }));
  const submit = (e) => {
    e.preventDefault();
    if (!form.subjectId) return;
    if (editing) dispatch({ type: "UPDATE_TIMETABLE", payload: { ...form, id: editing.id } });
    else dispatch({ type: "ADD_TIMETABLE", payload: { ...form, id: uid() } });
    onClose();
  };
  const del = () => { if (editing) dispatch({ type: "DELETE_TIMETABLE", payload: editing.id }); onClose(); };
  return (
    <Modal open={open} onClose={onClose} title={editing ? "Edit Class" : "Add Class"}>
      <form onSubmit={submit}>
        <Field label="Subject" required>
          <select className={inputCls} value={form.subjectId} onChange={e => set("subjectId", e.target.value)}>
            {state.subjects.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}

        </Field>
        <Field label="Day" required>
          <select className={inputCls} value={form.day} onChange={e => set("day", e.target.value)}>

          <Field label="End Time"><input type="time" className={inputCls} value={form.endTime} onChange={e => set("endTime", e.target.value)} /></Field>
        </div>

    subjects.forEach(s => {
      const st = computeStats(records.filter(r => r.subjectId === s.id));
      const status = getStatus(st, s.targetPercentage);
      if (status === "safe") safe++; else if (status === "risky") risky++; else if (status === "critical") critical++;
    });
    return { safe, risky, critical };

  const chartData = useMemo(() => {

      const st = computeStats(buckets[k]);
      const d = fromISO(k + "-01");
      return { month: MONTH_NAMES[d.getMonth()].slice(0,3) + " " + String(d.getFullYear()).slice(2), pct: st.percentage };

            <div className="bg-coral/10 border border-coral/20 rounded-2xl px-4 py-3.5 text-center">
              <div className="num text-2xl font-semibold text-coral">{counts.critical}</div>
              <div className="text-xs text-coral/80 mt-0.5">Critical</div>
            </div>
            <div className="bg-amber/10 border border-amber/20 rounded-2xl px-4 py-3.5 text-center">

      )}

  );
}

/* ============================== EXPORT ============================== */
function toCSV(subjects, records) {
  const header = ["Subject","Code","Date","Status","Notes"];
  const rows = records.map(r => {
    const s = subjects.find(x => x.id === r.subjectId);
    return [s?.name || "", s?.code || "", r.date, r.status, (r.notes||"").replace(/,/g," ")];
  });
  return [header, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
}
function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function openPrintReport(subjects, records, settings) {
  const rows = subjects.map(s => {
    const st = computeStats(records.filter(r => r.subjectId === s.id));
    const status = STATUS_LABEL[getStatus(st, s.targetPercentage)];
    return `<tr><td>${s.name}</td><td>${st.present}</td><td>${st.absent}</td><td>${st.total}</td><td>${st.percentage}%</td><td>${s.targetPercentage}%</td><td>${status}</td></tr>`;
  }).join("");
  const html = `<!DOCTYPE html><html><head><title>Attendance Report</title>
  <style>body{font-family:Arial,sans-serif;padding:32px;color:#111} h1{margin-bottom:4px} table{width:100%;border-collapse:collapse;margin-top:20px} th,td{border:1px solid #ddd;padding:8px;text-align:left;font-size:13px} th{background:#f2f2f2}</style>
  </head><body><h1>Attendance Report</h1><p>Academic Year: ${settings.academicYear}</p>
  <table><thead><tr><th>Subject</th><th>Present</th><th>Absent</th><th>Total</th><th>Attendance %</th><th>Target %</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>
  <script>window.onload=()=>window.print()<\/script></body></html>`;
  const w = window.open("", "_blank");
  w.document.write(html); w.document.close();
}
function ExportModal({ open, onClose }) {
  const { state } = useStore();
  const opts = [
    { key: "pdf", label: "PDF Report", desc: "Printable summary report", icon: "book" },
    { key: "excel", label: "Excel Spreadsheet", desc: "Detailed records (.csv, opens in Excel)", icon: "grid" },
    { key: "csv", label: "CSV", desc: "Raw attendance records", icon: "download" },
  ];
  const run = (key) => {
    if (key === "pdf") openPrintReport(state.subjects, state.records, state.settings);
    else if (key === "csv") downloadFile(toCSV(state.subjects, state.records), "attendance_records.csv", "text/csv");
    else downloadFile(toCSV(state.subjects, state.records), "attendance_records.xls.csv", "application/vnd.ms-excel");
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Export Attendance">
      <div className="flex flex-col gap-2">
        {opts.map(o => (
          <button key={o.key} onClick={() => run(o.key)} className="flex items-center gap-3 rounded-xl border border-brdr px-4 py-3 hover:border-faint text-left">
            <div className="w-9 h-9 rounded-lg bg-surface2 flex items-center justify-center text-mint"><Icon name={o.icon} size={17}/></div>
            <div><div className="text-sm font-medium">{o.label}</div><div className="text-xs text-faint">{o.desc}</div></div>
          </button>
        ))}
      </div>
    </Modal>
  );
}

      <SettingsRow label="Attendance Reminders"><Toggle value={settings.reminders} onChange={v => dispatch({ type: "UPDATE_SETTINGS", payload: { reminders: v } })} /></SettingsRow>
      <SettingsRow label="Low Attendance Alerts"><Toggle value={settings.lowAttendanceAlerts} onChange={v => dispatch({ type: "UPDATE_SETTINGS", payload: { lowAttendanceAlerts: v } })} /></SettingsRow>

      <SectionTitle>Academic Year</SectionTitle>
      <SettingsRow label="Current Academic Year">
        <input className={inputCls + " w-40 text-sm py-1.5"} value={settings.academicYear} onChange={e => dispatch({ type: "UPDATE_SETTINGS", payload: { academicYear: e.target.value } })} />
      </SettingsRow>

      <SectionTitle>Data Management</SectionTitle>
      <div className="flex flex-col gap-2 mb-6">
        <Button variant="secondary" onClick={() => setExportOpen(true)}><Icon name="download" size={15}/>Export Data</Button>
        <Button variant="secondary" onClick={() => fileRef.current.click()}><Icon name="upload" size={15}/>Import Data</Button>
        <input type="file" ref={fileRef} accept="application/json" className="hidden" onChange={importFile} />
        <Button variant="secondary" onClick={exportJSON}><Icon name="download" size={15}/>Backup as JSON</Button>
        {hasDemo ? (
          <Button variant="secondary" onClick={() => dispatch({ type: "CLEAR_DEMO" })}><Icon name="refresh" size={15}/>Clear Demo Data</Button>
        ) : (
          <Button variant="secondary" onClick={() => dispatch({ type: "LOAD_DEMO" })}><Icon name="refresh" size={15}/>Load Demo Data</Button>
        )}
        <Button variant="danger" onClick={() => setResetOpen(true)}><Icon name="trash" size={15}/>Reset All Data</Button>
      </div>

      <ExportModal open={exportOpen} onClose={() => setExportOpen(false)} />
      <ConfirmDialog open={resetOpen} onCancel={() => setResetOpen(false)} danger confirmLabel="Reset Everything"
        title="Reset all data?" body="This permanently deletes all subjects, attendance records, and timetable entries. This cannot be undone."
        onConfirm={() => { dispatch({ type: "RESET_ALL" }); setResetOpen(false); }} />
    </div>
  );
}
function SectionTitle({ children }) { return <div className="text-xs font-semibold text-faint uppercase tracking-wide mb-2.5 mt-6 first:mt-0">{children}</div>; }
function SettingsRow({ label, children }) {
  return (
    <div className="flex items-center justify-between bg-surface border border-brdr rounded-xl px-4 py-3 mb-2">
      <span className="text-sm">{label}</span>
      {children}
    </div>
  );
}
function Toggle({ value, onChange }) {
  return (
    <button onClick={() => onChange(!value)} className={`w-11 h-6 rounded-full transition relative ${value ? "bg-mint" : "bg-surface2 border border-brdr"}`}>
      <span className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-all ${value ? "left-5" : "left-0.5"}`} />
    </button>
  );
}

/* ============================== ROOT APP ============================== */
function App() {
  const [state, dispatch] = useReducer(reducer, null, () => loadState() || emptyState());
  const [page, setPage] = useState("dashboard");
  const [subjectId, setSubjectId] = useState(null);
  const [addOpen, setAddOpen] = useState(false);

  useEffect(() => { persist(state); }, [state]);
  useEffect(() => {
    const root = document.documentElement;
    if (state.settings.theme === "light") root.classList.add("theme-light"); else root.classList.remove("theme-light");
  }, [state.settings.theme]);

  const openSubject = (id) => setSubjectId(id);
  const goto = (p) => { setPage(p); setSubjectId(null); };

  let content;
  if (subjectId) content = <SubjectDetail subjectId={subjectId} onBack={() => setSubjectId(null)} />;
  else if (page === "dashboard") content = <Dashboard openSubject={openSubject} setAddOpen={setAddOpen} />;
  else if (page === "attendance") content = <AttendancePage />;
  else if (page === "timetable") content = <TimetablePage />;
  else if (page === "analytics") content = <AnalyticsPage />;
  else content = <SettingsPage />;

  return (
    <Store.Provider value={{ state, dispatch }}>
      <div className="min-h-screen bg-bg text-ink">
        <Sidebar page={page} setPage={goto} />
        <div className="sm:ml-60">{content}</div>
        <BottomNav page={page} setPage={goto} />
        <AddSubjectModal open={addOpen} onClose={() => setAddOpen(false)} />
      </div>
    </Store.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
